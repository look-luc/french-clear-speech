[project]
name = "french-clear-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "look-luc", email = "denardiluc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "evaluate>=0.4.6",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "peft>=0.21.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
french-clear-speech = "french_clear_speech:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
