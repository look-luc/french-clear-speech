<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My jsPsych Experiment</title>
    <!-- jsPsych Core CSS -->
    <link href="https://unpkg.com" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="index.css" />
    <!-- jsPsych Core Library -->
    <script src="https://unpkg.com"></script>
    <!-- Example Plugin (HTML Keyboard Response) -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <script>
        // Initialize jsPsych
        const jsPsych = initJsPsych();

        // Define a simple trial
        const hello_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<p>Hello! Press any key to finish.</p>'
        };

        // Run the experiment
        jsPsych.run([hello_trial]);
    </script>
</body>
</html>
